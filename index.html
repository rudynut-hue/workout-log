<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workout Log</title>
<meta name="theme-color" content="#f4c400">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column. Day strip on top, exercise list, bottom tab bar, bottom sheet for exercise detail. */
:root{
  --bg:#eceff0; --surface:#ffffff; --ink:#14181b; --muted:#5d666c; --line:#d5dade;
  --accent:#f4c400; --on-accent:#14181b; --ok:#1f7a45; --ok-bg:#dcf1e4; --shade:rgba(10,14,16,.5);
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#1a1f23; --ink:#eef1f2; --muted:#97a1a7; --line:#2b3237;
  --accent:#f4c400; --on-accent:#14181b; --ok:#5fcf8c; --ok-bg:#17301f; --shade:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1a1f23; --ink:#eef1f2; --muted:#97a1a7; --line:#2b3237;
  --accent:#f4c400; --on-accent:#14181b; --ok:#5fcf8c; --ok-bg:#17301f; --shade:rgba(0,0,0,.65); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-inline:16px}
*{box-sizing:border-box}
#app{max-width:520px;margin:0 auto;padding-block:16px 96px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.01em}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:2rem;line-height:1}
.top .sub{color:var(--muted);font-size:.9rem}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-block:14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;text-align:center;min-width:0}
.day b{display:block;font-family:var(--display);font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day span{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day[aria-pressed="true"] b{color:var(--on-accent)}
.day i{display:block;height:4px;margin:4px 10px 0;border-radius:2px;background:transparent}
.day i.has{background:var(--ok)}
.day[aria-pressed="true"] i.has{background:var(--on-accent)}
.sec{margin-block:22px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2{font-size:1.3rem;text-transform:uppercase;letter-spacing:.06em}
.sec small{color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:64px}
.row .txt{flex:1;min-width:0}
.row .nm{font-weight:600;overflow-wrap:anywhere}
.row .pl{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.badge{font-family:var(--display);font-weight:700;font-size:1.1rem;min-width:52px;text-align:center;padding:4px 8px;border-radius:6px;border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.done{background:var(--ok-bg);border-color:transparent}
.row.done .badge{background:var(--ok);color:var(--surface);border-color:transparent}
.row.dim{opacity:.6}
.chip{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:10px}
.empty b{color:var(--ink)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.nav button{border:0;border-radius:8px;padding:12px;font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-block:14px}
.tools input[type=search],.field input,.field select,.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;min-width:0}
.tools input[type=search]{flex:1 1 180px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.xrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 14px}
.xrow .nm{flex:1;min-width:0;background:none;border:0;text-align:left;padding:6px 0;font-weight:600;overflow-wrap:anywhere}
.xrow .sel{width:9.5rem;max-width:45%}
/* sheet */
.veil{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head h2{font-size:1.8rem;line-height:1.05;overflow-wrap:anywhere}
.x{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:44px;height:44px;flex:none;font-size:1.2rem}
.pic{margin-block:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pic img{display:block;width:100%;max-height:300px;object-fit:contain;background:#000}
.pic .ph{padding:22px 16px;text-align:center;color:var(--muted)}
.pic .acts{display:flex;gap:8px;flex-wrap:wrap;padding:10px;border-top:1px solid var(--line)}
.pic .acts>*{flex:1 1 130px;text-align:center;text-decoration:none;color:var(--ink);display:flex;align-items:center;justify-content:center}
.draw{display:block;width:100%;max-height:210px;padding:10px 8px 4px}
.dr-b{stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.dr-far{opacity:.4}
.dr-h{stroke:var(--ink);stroke-width:3;fill:var(--surface)}
.dr-p{fill:var(--accent);stroke:var(--ink);stroke-width:1.2}
.dr-g{stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dr-t{fill:var(--muted);font:600 6.5px var(--body);text-anchor:middle}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.hist{margin-top:18px}
.hist h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.chart{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.ch-l{stroke:var(--line);stroke-width:1}
.ch-s{stroke:var(--ink);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ch-d{fill:var(--ink)}
.ch-e{fill:var(--accent);stroke:var(--ink);stroke-width:1.5}
.ch-t{fill:var(--muted);font:600 8px var(--body)}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
.hrow+.hrow{margin-top:6px}
.hrow span:last-child{color:var(--muted);white-space:nowrap}
.up{color:var(--ok);font-weight:600}
.wknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-block:14px;font-variant-numeric:tabular-nums}
.wknav b{font-family:var(--display);font-size:1.4rem}
.wknav .btn{width:56px;font-size:1.3rem}
.wkbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-block:12px}
.wkbtn .btn:first-child{grid-column:1/-1}
.paper{background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;overflow-x:auto;margin-top:14px}
.paper table{border-collapse:collapse;font:12px/1.3 var(--body);min-width:620px;width:100%}
.paper td{border:1px solid #333;padding:4px 6px;vertical-align:top}
.g-daily{background:#FFFF00}.g-mwf{background:#FF9933}.g-tt{background:#92D050}.g-twice{background:#FF99FF}.g-once{background:#66FFFF}
@media print{
  .nav,.noprint{display:none!important}
  body{background:#fff;padding:0}#app{max-width:none;padding:0}
  .paper{border:0;border-radius:0;overflow:visible;margin:0;break-after:page}
  .paper table{min-width:0;font-size:10px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.today{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.today .big{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.today .last{color:var(--muted);font-size:.9rem;margin-top:2px}
.sets{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.set{width:64px;height:64px;border-radius:50%;border:2px solid var(--ink);background:transparent;font-family:var(--display);font-weight:700;font-size:1.5rem}
.set[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.plan{margin-top:18px}
.plan h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;min-height:40px;font-weight:600}
.tg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tg button.ov::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{width:100%}
.hint{color:var(--muted);font-size:.85rem;margin-top:8px}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px}
.chk input{width:22px;height:22px}
textarea{width:100%;min-height:90px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font:.8rem/1.3 ui-monospace,monospace}
.link{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted)}
</style>

</head>
<body>
<div id="app"></div>

<script>
(function(){
/* ---------- default exercises from the spreadsheet ---------- */
var RAW = [
 // [name, sets, reps, weighted, frequency]
 ['Nustep',1,'10 min',0,'daily'],['Arm Bike',1,'10 min',0,'daily'],['Treadmill',1,'10 min',0,'daily'],
 ['PT Exercises & Flexibility',1,'10 min',0,'daily'],['Med-X Super Stretch',1,'Optional',0,'daily'],
 ['Theraband Bilateral Flexion',3,'8-10',0,'daily'],['Theraband Horizontal Abduction',3,'8-10',0,'daily'],
 ['Theraband Bilateral External Rotation',3,'8-10',0,'daily'],['Vibratherapy',1,'Optional',0,'daily'],
 ['Box Lift and Carry',3,'Changes',1,'daily'],['Sled Push / Pull',3,'Changes',1,'daily'],
 ['Planks',3,'30 sec',0,'daily'],['Star Excursion Drill',3,'8-10',0,'daily'],['Medium Screw Transfer',3,'8-10',1,'daily'],
 ['mwf','Bucket Pull Vertical|Bucket Pull Horizontal|Ladder Climbs|Farmers Carry|Lat Pulldowns|Seated Rows|Barbell Push-Ups|Tricep Pushdowns|Stair Climbing Intervals|Easy Bar Curls|I\u2019s, Y\u2019s & T\u2019s'],
 ['tt','Slant Board Squats|One Arm Rows|Med-X Core Isolator|Champagne Press|Lateral Band Walks|Leg Extensions|Hamstring Curls|Clam Shells|Reverse Pulldowns|Calf Raises|Sledgehammer & Tire|Retro Band Walks'],
 ['twice','PVC Pipe Walk Ups|Concrete Bag Transfer|Med-X Lumbar Machine|Pallet Step-Ups|Twist Crunches|Bicep Curls|Hammer Curls|Med-X Torso Rotation|Wall Sits|Ab Wheel|Dumbbell Incline Bench|Dumbbell Shoulder Press|Lunges|Kettlebell Swings|Suitcase Carry|Flutter Kicks & Crossovers|Tib Bar|Hexagon Drill|Inverted Barbell Rows (Pronated and Supinated)|Bird Dogs|Forearm Roller|Dips'],
 ['once','Deadlift|Barbell Incline Press|Barbell Shoulder Press|Barbell Bent Over Rows|Barbell Back or Front Squats|Unilateral Sit To Stand Squats|Nordic Hamstring Curls|Turkish Get Ups|Plyometric Variations|Dumbbell Cleans and/or Snatches|Skull Crushers|Neutral Grip Incline Bench|Neutral Grip Shoulder Press']
];
var WEIGHTED = /barbell|dumbbell|curl|press|row|pulldown|pushdown|deadlift|squat|kettlebell|carry|extension|calf|skull|sled|farmers|suitcase|lunge|bench|clean|snatch|bag|hammer|dips|get ups|lift/i;
var NOTW = /band|wall sit|plank|hamstring curls\b.*nordic|nordic|clam|bird|flutter|crunch|ab wheel|push-ups|walk/i;
var FREQ = {daily:'Every day (Mon–Fri)',mwf:'Mon · Wed · Fri',tt:'Tue · Thu',twice:'2× a week, my days',once:'1× a week, my day',off:'Not scheduled'};
var DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function defaults(){
  var out=[],n=0;
  RAW.forEach(function(r){
    if(r.length===2){
      r[1].split('|').forEach(function(nm){
        var w = WEIGHTED.test(nm) && !NOTW.test(nm) ? 1 : 0;
        out.push({id:'e'+(n++),name:nm,freq:r[0],plan:{sets:3,reps:'8-10',weight:'',weighted:w},ov:{}});
      });
    } else out.push({id:'e'+(n++),name:r[0],freq:r[4],plan:{sets:r[1],reps:r[2],weight:'',weighted:r[3]},ov:{}});
  });
  return out;
}

/* ---------- storage (falls back to memory if blocked) ---------- */
var KEY='workoutlog.v1', PKEY='workoutlog.photos.v1';
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
var S = load(KEY) || {ex:defaults(),log:{},next:1000};
var PH = load(PKEY) || {};
(function(){ if(S.mig2)return; var d={};defaults().forEach(function(e){d[e.name.toLowerCase()]=e.freq});
  S.ex.forEach(function(e){ if(e.freq==='off'&&d[e.name.toLowerCase()])e.freq=d[e.name.toLowerCase()] }); S.mig2=1; save(KEY,S); })();
function persist(){save(KEY,S)}

/* ---------- dates ---------- */
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function weekOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);var a=[];for(var i=0;i<5;i++){a.push(dkey(x));x.setDate(x.getDate()+1)}return a}

/* ---------- model helpers ---------- */
function planFor(ex,dow){var o=ex.ov&&ex.ov[dow]||{};var p={};for(var k in ex.plan)p[k]=ex.plan[k];for(var k2 in o)p[k2]=o[k2];return p}
function entry(dk,id){return S.log[dk]&&S.log[dk][id]}
function checked(dk,id){var e=entry(dk,id);return e?e.sets.filter(Boolean).length:0}
function isDone(ex,dk){var p=planFor(ex,fromKey(dk).getDay());return checked(dk,ex.id)>=p.sets}
function weekCount(ex,wk){return wk.filter(function(k){return isDone(ex,k)}).length}
function scheduled(ex,dow){
  if(ex.freq==='daily')return dow>=1&&dow<=5;
  if(ex.freq==='mwf')return dow===1||dow===3||dow===5;
  if(ex.freq==='tt')return dow===2||dow===4;
  return false;
}
function summary(p){
  var s=p.sets+' × '+(p.reps||'–');
  if(p.weighted&&p.weight!=='')s+=' @ '+p.weight+' lb';
  return s;
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function byId(id){return S.ex.filter(function(e){return e.id===id})[0]}

/* ---------- ui state ---------- */
var U={tab:'today',date:(function(){var n=new Date(),g=n.getDay();if(g===6)n.setDate(n.getDate()-1);else if(g===0)n.setDate(n.getDate()-2);return dkey(n)})(),open:null,target:'all',filter:'sched',q:'',showBackup:false,adding:false,pq:'',allHist:false,wk:weekOf(new Date())[0]};
var app=document.getElementById('app');
U.persisted=null;
try{if(navigator.storage&&navigator.storage.persist){
  navigator.storage.persisted().then(function(p){return p?true:navigator.storage.persist()}).then(function(g){U.persisted=!!g;if(U.tab==='setup'||U.tab==='today')render()},function(){U.persisted=false})
}}catch(x){}
var todayKey=dkey(new Date());

function render(){
  var keepScroll=window.scrollY;
  app.innerHTML=(U.tab==='today'?viewToday():U.tab==='progress'?viewProgress():U.tab==='week'?viewWeek():viewSetup())+navHtml()+(U.open?sheetHtml():'');
  window.scrollTo(0,keepScroll);
  var sh=document.getElementById('sheet');if(sh&&U._sheetScroll)sh.scrollTop=U._sheetScroll;
}
function navHtml(){
  return '<nav class="nav" aria-label="Sections"><div>'+
   '<button data-a="tab" data-v="today"'+(U.tab==='today'?' aria-current="page"':'')+'>Today</button>'+
   '<button data-a="tab" data-v="progress"'+(U.tab==='progress'||U.tab==='week'?' aria-current="page"':'')+'>Progress</button>'+
   '<button data-a="tab" data-v="setup"'+(U.tab==='setup'?' aria-current="page"':'')+'>Exercises</button></div></nav>';
}
function viewToday(){
  var d=fromKey(U.date),dow=d.getDay(),wk=weekOf(d);
  var h='<div class="top"><h1>Workout Log</h1><div class="sub">'+d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</div></div>';
  var logDays=Object.keys(S.log).length,ago=S.lastBackup?(Date.now()-S.lastBackup)/864e5:Infinity;
  if(logDays>=5&&ago>14)h+='<div class="empty" style="margin-top:12px"><b>'+(S.lastBackup?'It has been '+Math.floor(ago)+' days since your last backup.':'You haven\u2019t backed up your log yet.')+'</b> A backup lets you restore your workouts if this phone clears the app. <button class="link" data-a="gobackup">Back up now</button></div>';
  h+='<div class="days" role="group" aria-label="Day of this week">'+wk.map(function(k){
    var dd=fromKey(k),any=S.ex.some(function(e){return checked(k,e.id)>0});
    return '<button class="day" data-a="day" data-v="'+k+'" aria-pressed="'+(k===U.date)+'"><b>'+DAYN[dd.getDay()]+'</b><span>'+dd.getDate()+'</span><i class="'+(any?'has':'')+'"></i></button>';
  }).join('')+'</div>';
  var sched=S.ex.filter(function(e){return scheduled(e,dow)});
  var flex=S.ex.filter(function(e){return e.freq==='twice'||e.freq==='once'});
  var doneN=sched.filter(function(e){return isDone(e,U.date)}).length;
  h+='<div class="sec"><h2>Scheduled</h2><small>'+doneN+' of '+sched.length+' done</small></div>';
  if(!sched.length)h+='<div class="empty"><b>Nothing scheduled for '+DAYN[dow]+'.</b> Set which days each exercise belongs to on the Exercises tab.</div>';
  else h+='<div class="list">'+sched.map(function(e){return rowHtml(e,dow)}).join('')+'</div>';
  if(flex.length){
    h+='<div class="sec"><h2>Pick your days</h2><small>counts reset every Monday</small></div><div class="list">'+
      flex.map(function(e){return rowHtml(e,dow,wk)}).join('')+'</div>';
  }
  return h;
}
function rowHtml(e,dow,wk){
  var p=planFor(e,dow),n=checked(U.date,e.id),done=n>=p.sets;
  var extra='',dim='';
  if(wk){
    var target=e.freq==='twice'?2:1,c=weekCount(e,wk);

function wrapLines(ctx,text,w,maxLines){
  var words=String(text).split(' '),lines=[],cur='';
  words.forEach(function(wd){var t=cur?cur+' '+wd:wd;if(ctx.measureText(t).width>w&&cur){lines.push(cur);cur=wd}else cur=t});
  if(cur)lines.push(cur);
  if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].replace(/.{0,2}$/,'')+'\u2026'}

}
function sheetImage(m,cb){
  var CW=[310,120,150,150,150,150,150],PAD=14,SC=2,W=CW.reduce(function(a,b){return a+b},0);
  var scratch=document.createElement('canvas').getContext('2d');
  var FONT='15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',BOLD='600 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  if(!m.sheets.length){cb([]);return}
  var out=[],left=m.sheets.length;
  m.sheets.forEach(function(rows,idx){
    var R=[];
    R.push([{t:'Name',b:1},{t:S.name||''}].concat(LEGEND.map(function(t,i){return {t:t,f:GCOL[GORDER[i]],c:1}})));
    R.push([{t:''},{t:'Date',b:1}].concat(m.dates.map(function(k){return {t:md(k),c:1}})));
    R.push([{t:'Activity',b:1},{t:'Amount',b:1}].concat(DAYFULL.map(function(d){return {t:d,b:1,c:1}})));
    rows.forEach(function(r){
      var f=r.group?GCOL[r.group]:null;
      R.push([{t:r.name,f:f},{t:r.amount,f:f}].concat(r.cells.map(function(t,j){return {t:t,f:r.group&&r.sched[j]?f:null,c:1}})));
    });
    R.forEach(function(row){
      var mx=1;row.forEach(function(c,i){scratch.font=c.b?BOLD:FONT;c.lines=wrapLines(scratch,c.t,CW[i]-14,2);mx=Math.max(mx,c.lines.length)});
      row.h=mx>1?46:32;
    });
    var H=PAD*2+R.reduce(function(x,r){return x+r.h},0);
    var cv=document.createElement('canvas');cv.width=(W+PAD*2)*SC;cv.height=H*SC;
    var ctx=cv.getContext('2d');ctx.scale(SC,SC);ctx.fillStyle='#fff';ctx.fillRect(0,0,W+PAD*2,H);
    ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.textBaseline='middle';
    var y=PAD;
    R.forEach(function(row){
      var x=PAD;
      row.forEach(function(c,i){
        if(c.f){ctx.fillStyle='#'+c.f;ctx.fillRect(x,y,CW[i],row.h)}
        ctx.strokeRect(x+.5,y+.5,CW[i],row.h);
        ctx.fillStyle='#000';ctx.font=c.b?BOLD:FONT;ctx.textAlign=c.c?'center':'left';
        var n=c.lines.length,lh=17,top=y+row.h/2-(n-1)*lh/2;
        c.lines.forEach(function(ln,li){ctx.fillText(ln,c.c?x+CW[i]/2:x+7,top+li*lh)});
        x+=CW[i];
      });
      y+=row.h;
    });
    cv.toBlob(function(b){out[idx]=b;if(--left===0)cb(out)},'image/png');
  });
}

  if(t.id==='flt'){U.filter=t.value;return render()}
  if(t.id==='photo'){return addPhoto(t.files&&t.files[0])}
  if(a==='freq'){byId(t.getAttribute('data-v')).freq=t.value;persist();keepSheet();return render()}
  if(a==='uw'){byId(U.open).plan.weighted=t.checked?1:0;persist();keepSheet();return render()}
  if(a==='pf'){
    keepSheet();
    var e=byId(U.open),f=t.getAttribute('data-v'),val=f==='sets'?+t.value:t.value;
    if(U.target==='all')e.plan[f]=val;
    else{e.ov[U.target]=e.ov[U.target]||{};
      if(!e.ov[U.target].hasOwnProperty('sets')){var cur=planFor(e,+U.target);e.ov[U.target]={sets:cur.sets,reps:cur.reps,weight:cur.weight}}
      e.ov[U.target][f]=val}
    persist();render();
  }
});
app.addEventListener('input',function(ev){
  if(ev.target.id==='pq'){U.pq=ev.target.value;var ps=ev.target.selectionStart;render();var pi=document.getElementById('pq');pi.focus();pi.setSelectionRange(ps,ps)}
  if(ev.target.id==='q'){U.q=ev.target.value;var pos=ev.target.selectionStart;render();var i=document.getElementById('q');i.focus();i.setSelectionRange(pos,pos)}
});
function addPhoto(file){
  if(!file)return;
  var id=U.open,fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=700,r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      PH[id]=c.toDataURL('image/jpeg',.8);
      if(!save(PKEY,PH)){/* storage full or blocked: still shown until reload */}
      keepSheet();render();
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&U.open){U.open=null;render()}
  var t=ev.target;if((ev.key==='Enter'||ev.key===' ')&&t.tagName==='LABEL'&&t.htmlFor==='photo'){ev.preventDefault();document.getElementById('photo').click()}
});
render();
})();
</script>
